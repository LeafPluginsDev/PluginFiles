# É necessário reiniciar o servidor após a alteração
warn:
  name: warn
  use-command: true
  aliases:
    - alertar
    - avisar
  usage: para alertar um jogador.

punish:
  name: punish
  use-command: true
  aliases:
    - punir
  usage: <motivo> para punir um jogador.

ban:
  name: ban
  use-command: true
  aliases:
    - banir
  usage: para banir um jogador.

kick:
  name: kick
  use-command: true
  aliases:
    - expulsar
  usage: para expulsar um jogador.

mute:
  name: mute
  use-command: true
  aliases:
    - silenciar
  usage: para silenciar um jogador.


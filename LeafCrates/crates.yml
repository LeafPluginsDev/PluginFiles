padrao:
  # Nome do tipo de caixa
  name: "&5&lCaixa Padrão"

  # Arquivo de recompensas (/plugins/LeafCrates/prizes/)
  prizes: "caixa-padrao.yml"

  # [Premium] Estilo de caixa (Particulas, blocos internos)
  # Styles.yml
  style: "none"

  # [Premium] Animação ao abrir a caixa
  # Deixe '-1' para não usar animação
  # Confira a lista de animações em https://leafplugins.com/plugin/LeafCrates
  animation: 1

  # Chave para abrir a caixa
  key:
    # Nome do item
    name: "%box_name%"

    # Tipo do item (Material)
    item: "TRIPWIRE_HOOK"

    # Descrição do item
    lore:
      - ""
      - "&7Use esta chave para abrir"
      - "&7uma caixa misteriosa do tipo"
      - ""
      - "&eUse o botão direito na caixa"

  # Usar holograma customizado ao em vez da config.yml
  holograms:
    prize:
      height: 0.5
      lines:
        1:
          # Caso haja mais de um nesta lista, fará uma linha animada
          frames:
            - '&f« &5&lCAIXA PADRÃO &f»'
            - '&f« &f&lCAIXA PADRÃO &f»'
            - '&f« &5&lC&f&lAIXA PADRÃO &f»'

    format: "&b/%label% %command% &8- &f%description%"
    names:
      criar: "criar"
      expulsar: "expulsar"
      convidar: "convidar"
      online: "online"
      info: "info"
      chat: "chat"
      aceitar: "aceitar"
      recusar: "recusar"
      convites: "convites"
      pedidos: "pedidos"
      promover: "promover"
      rebaixar: "rebaixar"
      transferir: "transferir"
      upgrade: "upgrade"
      set: "set"
      bau: "bau"
      sethome: "sethome"
      home: "home"
      ally: "ally"
      inimigo: "inimigo"
      sair: "sair"

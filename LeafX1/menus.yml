        - "&8Confira os detalhes antes de enviar."
    arena:
      action: "arena"
      name: "&eArena"
      item: "item_frame"
      slot: 19
      lore:
        - ""
        - "&7Selecionada: &f%arena%"
        - "&7Kit: &f%kit%"
        - ""
        - "&aClique para escolher a arena."
    animation:
      action: "animation"
      name: "&eAnimação de vitória"
      item: "nether_star"
      slot: 21
      lore:
        - ""
        - "&7Selecionada: &f%animation%"
        - ""
        - "&aAltere com /x1 opcoes"
    own-items:
      action: "ownitems"
      name: "&eItens próprios"
      item: "iron_sword"
      slot: 23
      lore:
        - ""
        - "&7Modo atual: &f%active%"
        - "&7Combate: &f%mode%"
        - ""
        - "&aClique para %enabled%."
    economy:
      action: "economy"
      name: "&aEconomia"
      item: "emerald"
      slot: 25
      lore:
        - ""
        - "&7Atual: &f%economy%"
        - ""
        - "&aClique para trocar."
    lower-bet:
      action: "lowerbet"
      name: "&cDiminuir aposta"
      item: "ink_sack:1"
      slot: 29
      lore:
        - ""
        - "&7Reduz o valor da aposta."
        - "&aClique para diminuir."
    bet:
      action: "bet"
      name: "&eValor da aposta"
      item: "gold_ingot"
      slot: 31
      lore:
        - ""
        - "&7Valor atual: &a%bet%"
        - "&7Economia: &f%economy%"
        - ""
        - "&aClique para digitar manualmente."
        - "&8Exemplos: 1000, 10k, 1m"
    raise-bet:
      action: "raisebet"
      name: "&aAumentar aposta"
      item: "ink_sack:10"
      slot: 33
      lore:
        - ""
        - "&7Aumenta sem passar do seu saldo."
        - "&aClique para aumentar."
    challenge:
      action: "challenge"
      name: "&aEnviar desafio"
      item: "arrow"
      slot: 49
      closeInventory: true
      lore:
        - ""
        - "&7Alvo: &f%target%"
        - "&7Aposta: &a%bet% &7(%economy%)"
        - ""
        - "&aClique para enviar o convite."


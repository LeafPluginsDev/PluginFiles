main-menu:
  title: "&bGerenciar Tags"
  slots: 54

  list:
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    format:
      name: "&b%tag_id% &7(%tag_type%)"
      item: "%tag_icon%"
      lore:
        - ""
        - "&fNome: &b%tag_name%"
        - "&fArquivo: &7%tag_file%"
        - "&fCategoria: &7%tag_category%"
        - "&fPermissão: &7%tag_permission%"
        - ""
        - "&eClique para editar"

  items:
    info:
      name: "&bTags do servidor"
      item: "name_tag"
      slot: 4
      lore:
        - "&fVersão: &b%tags_version%"
        - "&fTotal: &b%tags_total%"

    create-normal:
      name: "&aCriar tag normal"
      item: "emerald"
      slot: 47
      lore:
        - "&7Cria uma tag no arquivo configurado."

    create-animated:
      name: "&dCriar tag animada"
      item: "nether_star"
      slot: 48
      lore:
        - "&7Disponível apenas no Premium."
        - "&7Cria a tag em animated.yml."

    save:
      name: "&aSalvar alterações"
      item: "ink_sack:10"
      slot: 49
      lore:
        - "&7Grava os arquivos e recarrega"
        - "&7as tags em seguida."

    reload:
      name: "&eRecarregar arquivos"
      item: "watch"
      slot: 50
      lore:
        - "&7Descarta alterações não salvas"
        - "&7e lê os arquivos novamente."

    previous-page:
      name: "&7Pág. anterior &7(&b%tags_previouspage%&7/&b%tags_maxpages%&7)"
      item: "arrow"
      slot: 45
      lore:
        - "&7Ir para a página anterior."

    next-page:
      name: "&7Próx. página &7(&b%tags_nextpage%&7/&b%tags_maxpages%&7)"
      item: "arrow"
      slot: 53
      lore:
        - "&7Ir para a próxima página."


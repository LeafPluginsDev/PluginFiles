    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
    # Formato aplicado para cada terreno listado.
    format:
      name: '&a&l%terrain%'
      item: 'MAP'
      closeInventory: false
      lore:
        - '&8Terreno protegido'
        - ''
        - '&7Dono: &f%owner%'
        - '&7Área: &f%area% blocos'
        - '&7Confiados: &f%members%'
        - ''
        - '&eClique para gerenciar.'
